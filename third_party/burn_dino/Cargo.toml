[package]
edition = "2024"
name = "burn_dino"
version = "0.7.0"
authors = ["mosure <mitchell@mosure.me>"]
build = false
exclude = [
    ".devcontainer",
    ".github",
    "docs",
    "dist",
    "build",
    "assets",
    "credits",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "burn dino model inference and training"
homepage = "https://github.com/mosure/burn_dino"
readme = "README.md"
keywords = [
    "burn",
    "dino",
    "vit",
]
categories = ["computer-vision"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mosure/burn_dino"
resolver = "2"

[features]
backend_cpu = ["burn/cpu"]
backend_cuda = ["burn/cuda"]
backend_ndarray = ["burn/ndarray"]
backend_wgpu = ["burn/wgpu"]
benchmark = [
    "burn/autotune",
    "burn/fusion",
]
default = ["backend_ndarray"]
import = [
    "backend_ndarray",
    "bevy_args",
    "burn-store",
    "clap",
    "serde_json",
]

[lib]
name = "burn_dino"
path = "src/lib.rs"

[[bin]]
name = "import"
path = "tool/import.rs"
required-features = ["import"]

[[example]]
name = "correctness"
path = "example/correctness.rs"

[[example]]
name = "pca"
path = "example/pca.rs"
required-features = ["backend_wgpu"]

[[example]]
name = "tsne"
path = "example/tsne.rs"
required-features = ["backend_wgpu"]

[[test]]
name = "correctness"
path = "tests/correctness.rs"

[[bench]]
name = "dinov2"
path = "tool/benchmark.rs"
harness = false

[dependencies.bevy_args]
version = "2.0"
optional = true

[dependencies.burn]
version = "0.21.0-pre.1"
features = ["std"]
default-features = false

[dependencies.burn-store]
version = "0.21.0-pre.1"
optional = true

[dependencies.clap]
version = "4.5"
features = ["derive"]
optional = true

[dependencies.safetensors]
version = "0.6"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"
optional = true

[dev-dependencies.bhtsne]
version = "0.5.3"

[dev-dependencies.criterion]
version = "0.7"
features = ["html_reports"]

[dev-dependencies.futures-intrusive]
version = "0.5.0"

[dev-dependencies.image]
version = "0.25"
features = ["png"]
default-features = false

[dev-dependencies.pollster]
version = "0.4.0"

[target.'cfg(target_arch = "wasm32")'.dependencies.console_error_panic_hook]
version = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen]
version = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "Element",
    "HtmlElement",
    "Location",
    "Node",
    "Window",
]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.wasm-release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>bevy_synth</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0d1117;
        color: #d6deeb;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      }
      body {
        overflow: hidden;
      }
      #boot {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 1000;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border: 1px solid rgba(180, 200, 240, 0.22);
        border-radius: 10px;
        background: rgba(7, 11, 18, 0.9);
        backdrop-filter: blur(3px);
      }
      #dot {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: #6dd3ff;
        box-shadow: 0 0 0 0 rgba(109, 211, 255, 0.5);
        animation: pulse 1.2s infinite;
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(109, 211, 255, 0.5);
        }
        70% {
          box-shadow: 0 0 0 12px rgba(109, 211, 255, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(109, 211, 255, 0);
        }
      }
      #boot-text {
        font-size: 14px;
        letter-spacing: 0.01em;
      }
      #boot-start {
        appearance: none;
        border: 1px solid rgba(180, 200, 240, 0.28);
        background: rgba(32, 64, 104, 0.4);
        color: #d6deeb;
        border-radius: 8px;
        padding: 6px 10px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      #boot-start:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #boot-controls {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      #boot-quality-label {
        font-size: 12px;
        letter-spacing: 0.01em;
        color: #afc3e6;
      }
      #boot-quality {
        appearance: none;
        border: 1px solid rgba(180, 200, 240, 0.28);
        background: rgba(24, 38, 60, 0.7);
        color: #d6deeb;
        border-radius: 8px;
        padding: 5px 8px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      #boot-quality:disabled {
        opacity: 0.6;
        cursor: default;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div id="dot"></div>
      <div id="boot-text">click start to initialize wasm</div>
      <div id="boot-controls">
        <label id="boot-quality-label" for="boot-quality">Quality</label>
        <select id="boot-quality" name="quality">
          <option value="fast">fast</option>
          <option value="balanced" selected>balanced</option>
          <option value="full">full</option>
        </select>
      </div>
      <button id="boot-start" type="button">Start</button>
    </div>
    <script type="module">
      const boot = document.getElementById("boot");
      const text = document.getElementById("boot-text");
      const startButton = document.getElementById("boot-start");
      const qualitySelect = document.getElementById("boot-quality");
      let started = false;
      let wasm = null;
      let warmupPollActive = false;

      const moduleUrl = "./out/bevy_synth.js";
      const wasmUrl = "./out/bevy_synth_bg.wasm";

      const normalizeQuality = (value) => {
        const normalized = String(value || "").trim().toLowerCase();
        if (normalized === "fast") return "fast";
        if (normalized === "balanced" || normalized === "balance") return "balanced";
        if (normalized === "full") return "full";
        return null;
      };

      const setQualityQueryParam = (qualityValue) => {
        const quality = normalizeQuality(qualityValue) || "balanced";
        const url = new URL(window.location.href);
        if (quality === "balanced") {
          url.searchParams.delete("quality");
        } else {
          url.searchParams.set("quality", quality);
        }
        window.history.replaceState({}, "", url);
        return quality;
      };

      const initialQuality =
        normalizeQuality(new URLSearchParams(window.location.search).get("quality")) ||
        "balanced";
      qualitySelect.value = initialQuality;

      const start = async () => {
        if (started) return;
        started = true;
        startButton.disabled = true;
        qualitySelect.disabled = true;
        qualitySelect.value = setQualityQueryParam(qualitySelect.value);
        text.textContent = "loading wasm module...";
        try {
          const mod = await import(moduleUrl);
          const wasmResponse = await fetch(wasmUrl);
          if (!wasmResponse.ok) {
            throw new Error(`failed to fetch bevy_synth wasm: HTTP ${wasmResponse.status}`);
          }
          await mod.default(wasmResponse);
          wasm = mod;
          window.__burnSynthWasm = wasm;
          window.__burnSynthWasmReady = true;
          text.textContent = "module ready. waiting for model warmup...";

          const pollWarmup = () => {
            if (!warmupPollActive) return;
            const state = String(window.__bevySynthWarmupState || "");
            const message = String(window.__bevySynthWarmupMessage || "");
            if (message) {
              text.textContent = message;
            } else if (state === "requested" || state === "loading") {
              text.textContent = "loading model weights...";
            } else if (state === "ready") {
              text.textContent = "model warmup complete";
            } else if (state === "failed") {
              text.textContent = "model warmup failed (see console logs)";
            }

            if (state === "ready") {
              warmupPollActive = false;
              setTimeout(() => boot.remove(), 600);
              return;
            }
            if (state === "failed") {
              warmupPollActive = false;
              startButton.disabled = false;
              qualitySelect.disabled = false;
              started = false;
              return;
            }
            requestAnimationFrame(pollWarmup);
          };

          warmupPollActive = true;
          requestAnimationFrame(pollWarmup);
        } catch (err) {
          console.error("failed to initialize bevy_synth wasm", err);
          text.textContent = "failed to load wasm module";
          warmupPollActive = false;
          startButton.disabled = false;
          qualitySelect.disabled = false;
          started = false;
        }
      };

      qualitySelect.addEventListener("change", () => {
        qualitySelect.value = setQualityQueryParam(qualitySelect.value);
      });
      startButton.addEventListener("click", start);
    </script>
  </body>
</html>

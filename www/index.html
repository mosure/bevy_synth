<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>bevy_synth</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0d1117;
        color: #d6deeb;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      }
      body {
        overflow: hidden;
      }
      #boot {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 1000;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border: 1px solid rgba(180, 200, 240, 0.22);
        border-radius: 10px;
        background: rgba(7, 11, 18, 0.9);
        backdrop-filter: blur(3px);
      }
      #dot {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: #6dd3ff;
        box-shadow: 0 0 0 0 rgba(109, 211, 255, 0.5);
        animation: pulse 1.2s infinite;
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(109, 211, 255, 0.5);
        }
        70% {
          box-shadow: 0 0 0 12px rgba(109, 211, 255, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(109, 211, 255, 0);
        }
      }
      #boot-text {
        font-size: 14px;
        letter-spacing: 0.01em;
      }
      #boot-start {
        appearance: none;
        border: 1px solid rgba(180, 200, 240, 0.28);
        background: rgba(32, 64, 104, 0.4);
        color: #d6deeb;
        border-radius: 8px;
        padding: 6px 10px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      #boot-start:disabled {
        opacity: 0.6;
        cursor: default;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div id="dot"></div>
      <div id="boot-text">click start to initialize wasm</div>
      <button id="boot-start" type="button">start</button>
    </div>
    <script type="module">
      const boot = document.getElementById("boot");
      const text = document.getElementById("boot-text");
      const startButton = document.getElementById("boot-start");
      let started = false;
      let wasm = null;
      let warmupPollActive = false;

      const moduleUrl = "./out/bevy_synth.js";
      const wasmUrl = "./out/bevy_synth_bg.wasm";
      let serviceWorkerReadyPromise = null;
      // Model source override query params (optional):
      // - `?model_source=local` (bundled `assets/models`)
      // - `?model_source=cdn`   (`https://aberration.technology/model`)
      // - `?model_base_url=<custom-root>`

      const serviceWorkerCandidates = () => {
        const pageUrl = new URL(window.location.href);
        // Try same-directory first:
        // - local dev/test page `/www/index.html` -> `/www/burn_synth_bpk_sw.js`
        // - deployed page `/index.html`         -> `/burn_synth_bpk_sw.js`
        //
        // Fallback to parent-directory for compatibility with alternate layouts.
        return [
          new URL("burn_synth_bpk_sw.js", pageUrl),
          new URL("../burn_synth_bpk_sw.js", pageUrl),
        ];
      };

      const ensureModelCacheServiceWorker = async () => {
        if (!("serviceWorker" in navigator)) {
          return false;
        }
        if (serviceWorkerReadyPromise) {
          return serviceWorkerReadyPromise;
        }
        serviceWorkerReadyPromise = (async () => {
          for (const candidate of serviceWorkerCandidates()) {
            try {
              await navigator.serviceWorker.register(candidate);
              await navigator.serviceWorker.ready;
              return true;
            } catch (_err) {
              // Keep trying candidates to support both local `/www/*` and deployed root/subpath pages.
            }
          }
          console.warn("failed to register burn_synth model cache service worker");
          return false;
        })();
        return serviceWorkerReadyPromise;
      };

      const start = async () => {
        if (started) return;
        started = true;
        startButton.disabled = true;
        text.textContent = "initializing model cache...";
        await ensureModelCacheServiceWorker();
        text.textContent = "loading wasm module...";
        try {
          const mod = await import(moduleUrl);
          const wasmResponse = await fetch(wasmUrl);
          if (!wasmResponse.ok) {
            throw new Error(`failed to fetch bevy_synth wasm: HTTP ${wasmResponse.status}`);
          }
          await mod.default(wasmResponse);
          wasm = mod;
          window.__burnSynthWasm = wasm;
          window.__burnSynthWasmReady = true;
          text.textContent = "module ready. starting app...";

          const pollWarmup = () => {
            if (!warmupPollActive) return;
            const state = String(window.__bevySynthWarmupState || "");
            const message = String(window.__bevySynthWarmupMessage || "");
            if (message) {
              text.textContent = message;
            } else if (state === "requested" || state === "loading") {
              text.textContent = "loading model weights...";
            } else if (state === "ready") {
              text.textContent = "app ready";
            } else if (state === "failed") {
              text.textContent = "app startup failed (see console logs)";
            }

            if (state === "ready") {
              warmupPollActive = false;
              setTimeout(() => boot.remove(), 600);
              return;
            }
            if (state === "failed") {
              warmupPollActive = false;
              startButton.disabled = false;
              started = false;
              return;
            }
            requestAnimationFrame(pollWarmup);
          };

          warmupPollActive = true;
          requestAnimationFrame(pollWarmup);
        } catch (err) {
          console.error("failed to initialize bevy_synth wasm", err);
          text.textContent = "failed to load wasm module";
          warmupPollActive = false;
          startButton.disabled = false;
          started = false;
        }
      };

      startButton.addEventListener("click", start);
    </script>
  </body>
</html>

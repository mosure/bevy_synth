<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>burn_synth wasm app</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0d1117;
        color: #d6deeb;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      }
      body {
        display: grid;
        place-items: center;
      }
      #boot {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border: 1px solid rgba(180, 200, 240, 0.22);
        border-radius: 10px;
        background: rgba(7, 11, 18, 0.9);
      }
      #boot-text {
        font-size: 14px;
        letter-spacing: 0.01em;
      }
      #boot-start {
        appearance: none;
        border: 1px solid rgba(180, 200, 240, 0.28);
        background: rgba(32, 64, 104, 0.4);
        color: #d6deeb;
        border-radius: 8px;
        padding: 6px 10px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      #boot-start:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #boot-controls {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .boot-control {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .boot-control-label {
        font-size: 12px;
        letter-spacing: 0.01em;
        color: #afc3e6;
      }
      .boot-control-select {
        appearance: none;
        border: 1px solid rgba(180, 200, 240, 0.28);
        background: rgba(24, 38, 60, 0.7);
        color: #d6deeb;
        border-radius: 8px;
        padding: 5px 8px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .boot-control-select:disabled {
        opacity: 0.6;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div id="boot-text">click start to initialize burn_synth wasm</div>
      <button id="boot-start" type="button">Start</button>
      <div id="boot-controls">
        <div class="boot-control">
          <label class="boot-control-label" for="synthesis-model">synthesis</label>
          <select id="synthesis-model" class="boot-control-select" name="synthesis_model">
            <option value="triposg" selected>triposg</option>
            <option value="trellis">trellis</option>
            <option value="triposplat">triposplat</option>
          </select>
        </div>
        <div class="boot-control">
          <label class="boot-control-label" for="asset-format">format</label>
          <select id="asset-format" class="boot-control-select" name="asset_format">
            <option value="splat" selected>splat</option>
            <option value="ply">ply</option>
          </select>
        </div>
      </div>
      <input id="image-file" type="file" accept=".png,.jpg,.jpeg,.webp" disabled />
      <button id="run-infer" type="button" disabled>Infer GLB</button>
      <a id="download" style="display: none" download="burn_synth_output.glb">download glb</a>
    </div>
    <script type="module">
      const text = document.getElementById("boot-text");
      const startButton = document.getElementById("boot-start");
      const synthesisModelSelect = document.getElementById("synthesis-model");
      const assetFormatSelect = document.getElementById("asset-format");
      const imageInput = document.getElementById("image-file");
      const runButton = document.getElementById("run-infer");
      const download = document.getElementById("download");
      let wasm = null;
      const moduleUrl = "./out/burn_synth.js";
      const wasmUrl = "./out/burn_synth_bg.wasm";
      let serviceWorkerReadyPromise = null;
      // Model source override query params (optional):
      // - `?model_source=local` (bundled `assets/models`)
      // - `?model_source=cdn`   (`https://aberration.technology/model`)
      // - `?model_base_url=<custom-root>`

      const serviceWorkerCandidates = () => {
        const pageUrl = new URL(window.location.href);
        // Try same-directory first:
        // - local dev/test page `/www/synth_api.html` -> `/www/burn_synth_bpk_sw.js`
        // - deployed page `/synth_api.html`           -> `/burn_synth_bpk_sw.js`
        //
        // Fallback to parent-directory for compatibility with alternate layouts.
        return [
          new URL("burn_synth_bpk_sw.js", pageUrl),
          new URL("../burn_synth_bpk_sw.js", pageUrl),
        ];
      };

      const serviceWorkerDisabledByQuery = () => {
        const params = new URLSearchParams(window.location.search);
        const raw = params.get("sw") ?? params.get("service_worker");
        if (!raw) {
          return false;
        }
        const value = raw.trim().toLowerCase();
        return (
          value === "0" ||
          value === "off" ||
          value === "false" ||
          value === "disable" ||
          value === "disabled" ||
          value === "none"
        );
      };

      const ensureModelCacheServiceWorker = async () => {
        if (serviceWorkerDisabledByQuery()) {
          return false;
        }
        if (!("serviceWorker" in navigator)) {
          return false;
        }
        if (serviceWorkerReadyPromise) {
          return serviceWorkerReadyPromise;
        }
        serviceWorkerReadyPromise = (async () => {
          for (const candidate of serviceWorkerCandidates()) {
            try {
              await navigator.serviceWorker.register(candidate);
              await navigator.serviceWorker.ready;
              return true;
            } catch (_err) {
              // Keep trying candidates to support both local `/www/*` and deployed root/subpath pages.
            }
          }
          console.warn("failed to register burn_synth model cache service worker");
          return false;
        })();
        return serviceWorkerReadyPromise;
      };

      const normalizeSynthesisModel = (value) => {
        const normalized = String(value || "").trim().toLowerCase();
        if (normalized === "triposg" || normalized === "tripo") return "triposg";
        if (normalized === "trellis" || normalized === "trellis2" || normalized === "trellis.2") {
          return "trellis";
        }
        if (
          normalized === "triposplat" ||
          normalized === "tripo-splat" ||
          normalized === "splat"
        ) {
          return "triposplat";
        }
        return null;
      };

      const normalizeAssetFormat = (value) => {
        const normalized = String(value || "").trim().toLowerCase();
        if (normalized === "ply") return "ply";
        if (normalized === "splat" || normalized === "3dgs") return "splat";
        return null;
      };

      const setInferButtonForSelection = ({ synthesisModel, assetFormat }) => {
        if (synthesisModel === "triposplat") {
          assetFormatSelect.disabled = false;
          const ext = assetFormat === "ply" ? "ply" : "splat";
          runButton.textContent = `Infer ${ext.toUpperCase()}`;
          download.download = `burn_synth_output.${ext}`;
          download.textContent = `download ${ext}`;
        } else {
          assetFormatSelect.disabled = true;
          runButton.textContent = "Infer GLB";
          download.download = "burn_synth_output.glb";
          download.textContent = "download glb";
        }
      };

      const setBootQueryParams = ({ synthesisModelValue, assetFormatValue }) => {
        const synthesisModel = normalizeSynthesisModel(synthesisModelValue) || "triposg";
        const assetFormat = normalizeAssetFormat(assetFormatValue) || "splat";
        const url = new URL(window.location.href);
        if (synthesisModel === "triposg") {
          url.searchParams.delete("synthesis_model");
          url.searchParams.delete("synthesis");
        } else {
          url.searchParams.set("synthesis_model", synthesisModel);
          url.searchParams.delete("synthesis");
        }
        if (synthesisModel === "triposplat" && assetFormat === "ply") {
          url.searchParams.set("asset_format", assetFormat);
        } else {
          url.searchParams.delete("asset_format");
        }
        window.history.replaceState({}, "", url);
        const selected = { synthesisModel, assetFormat };
        setInferButtonForSelection(selected);
        return selected;
      };

      const urlSearchParams = new URLSearchParams(window.location.search);
      const initialSynthesisModel =
        normalizeSynthesisModel(
          urlSearchParams.get("synthesis_model") || urlSearchParams.get("synthesis"),
        ) || "triposg";
      const initialAssetFormat =
        normalizeAssetFormat(urlSearchParams.get("asset_format")) || "splat";
      synthesisModelSelect.value = initialSynthesisModel;
      assetFormatSelect.value = initialAssetFormat;
      setInferButtonForSelection({
        synthesisModel: initialSynthesisModel,
        assetFormat: initialAssetFormat,
      });

      const start = async () => {
        startButton.disabled = true;
        text.textContent = "initializing model cache...";
        await ensureModelCacheServiceWorker();
        text.textContent = "loading wasm module...";
        try {
          const mod = await import(moduleUrl);
          const wasmResponse = await fetch(wasmUrl);
          if (!wasmResponse.ok) {
            throw new Error(`failed to fetch burn_synth wasm: HTTP ${wasmResponse.status}`);
          }
          await mod.default(wasmResponse);
          wasm = mod;
          window.__burnSynthWasm = wasm;
          window.__burnSynthWasmReady = true;
          let hasWebGpu = false;
          if (typeof wasm.webgpu_available === "function") {
            hasWebGpu = await wasm.webgpu_available();
          }
          if (!hasWebGpu) {
            imageInput.disabled = true;
            runButton.disabled = true;
            synthesisModelSelect.disabled = true;
            assetFormatSelect.disabled = true;
            text.textContent = "module ready (WebGPU unavailable in this browser/runtime)";
          } else {
            imageInput.disabled = false;
            runButton.disabled = false;
            synthesisModelSelect.disabled = false;
            setBootQueryParams({
              synthesisModelValue: synthesisModelSelect.value,
              assetFormatValue: assetFormatSelect.value,
            });
            text.textContent = "module ready";
          }
        } catch (err) {
          console.error("failed to initialize burn_synth wasm api", err);
          text.textContent = "failed to load wasm module";
          startButton.disabled = false;
        }
      };

      const infer = async () => {
        const file = imageInput.files?.[0];
        if (!file) {
          text.textContent = "choose an input image first";
          return;
        }
        runButton.disabled = true;
        download.style.display = "none";
        text.textContent = "running inference...";
        try {
          const selected = setBootQueryParams({
            synthesisModelValue: synthesisModelSelect.value,
            assetFormatValue: assetFormatSelect.value,
          });
          const bytes = new Uint8Array(await file.arrayBuffer());
          const options = new wasm.WasmInferOptions();
          options.set_synthesis_model(selected.synthesisModel);
          options.set_rmbg_model("rmbg14");
          options.set_backend("wgpu");

          let output = null;
          let mime = "model/gltf-binary";
          let extension = "glb";
          if (selected.synthesisModel === "triposplat") {
            mime = "application/octet-stream";
            extension = selected.assetFormat === "ply" ? "ply" : "splat";
            const inferFn =
              selected.assetFormat === "ply"
                ? wasm.infer_ply_from_image_bytes_with_options
                : wasm.infer_splat_from_image_bytes_with_options;
            if (typeof inferFn !== "function") {
              throw new Error(`burn_synth wasm module does not expose ${extension} inference`);
            }
            output = await inferFn(bytes, file.name, options);
          } else {
            output = await wasm.infer_glb_from_image_bytes_with_options(bytes, file.name, options);
          }

          const blob = new Blob([output], { type: mime });
          download.href = URL.createObjectURL(blob);
          download.download = `burn_synth_output.${extension}`;
          download.textContent = `download ${extension}`;
          download.style.display = "inline";
          text.textContent = `inference complete (${(output.byteLength / (1024 * 1024)).toFixed(1)} MiB)`;
        } catch (err) {
          console.error("burn_synth wasm inference failed", err);
          text.textContent = `inference failed: ${String(err)}`;
        } finally {
          runButton.disabled = false;
        }
      };

      synthesisModelSelect.addEventListener("change", () => {
        setBootQueryParams({
          synthesisModelValue: synthesisModelSelect.value,
          assetFormatValue: assetFormatSelect.value,
        });
      });
      assetFormatSelect.addEventListener("change", () => {
        setBootQueryParams({
          synthesisModelValue: synthesisModelSelect.value,
          assetFormatValue: assetFormatSelect.value,
        });
      });
      startButton.addEventListener("click", start);
      runButton.addEventListener("click", infer);
    </script>
  </body>
</html>

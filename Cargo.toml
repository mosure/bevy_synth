[workspace]
resolver = "2"
members = [
  "crates/burn_3d_synth",
  "crates/burn_3d_synth_tripo",
  "crates/burn_3d_synth_bevy",
  "crates/burn_3d_synth_bg_removal",
]

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.wasm-release]
strip = "symbols"
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

[workspace]
resolver = "2"
members = [
  "crates/burn_synth_import",
  "crates/burn_flex_gmm",
  "crates/burn_synth",
  "crates/burn_trellis",
  "crates/burn_flux",
  "crates/burn_triposplat",
  "crates/burn_tripo",
  "crates/bevy_synth",
  "crates/bevy_synth_runtime",
  "crates/bevy_synth_ui",
  "crates/burn_foreground",
  "crates/burn_synth_mcp",
]
exclude = ["third_party/burn_dino", "third_party/cubek-attention"]

[workspace.package]
authors = ["mosure <mitchell@mosure.me>"]
license = "MIT OR Apache-2.0"
keywords = [
  "bevy",
  "editor",
  "asset-synthesis",
  "render-pipeline",
  "gltf",
]
categories = [
  "computer-vision",
  "graphics",
  "rendering",
  "rendering::data-formats",
]
homepage = "https://github.com/mosure/bevy_synth"
repository = "https://github.com/mosure/bevy_synth"
readme = "README.md"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "unwind"

[profile.wasm-release]
strip = "symbols"
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

[patch.crates-io]
burn_dino = { path = "third_party/burn_dino" }
cubek-attention = { path = "third_party/cubek-attention" }

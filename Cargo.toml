[package]
name = "burn_3d_synth"
description = "TripoSG(-scribble) implemented in burn"
version = "0.1.0"
edition = "2024"
authors = ["mosure <mitchell@mosure.me>"]
license = "MIT OR Apache-2.0"
keywords = [
  "burn",
  "triposg",
  "scribble",
  "vit",
]
categories = [
  "computer-vision",
]
homepage = "https://github.com/mosure/burn_3d_synth"
repository = "https://github.com/mosure/burn_3d_synth"
readme = "README.md"
exclude = [
  ".devcontainer",
  ".github",
  "docs",
  "dist",
  "build",
  "assets",
  "credits",
]

[workspace]
members = []

resolver = "2"


[features]
default = []

benchmark = ["burn/autotune", "burn/fusion"]
import = ["burn-import", "clap", "serde"]


[dependencies]
# burn-import = { version = "0.17", features = ["pytorch"], optional = true }
burn-import = { git = "https://github.com/tracel-ai/burn.git", features = ["pytorch"], optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
serde = { version = "1.0", optional = true }



[dependencies.burn]
git = "https://github.com/tracel-ai/burn.git"
default-features = true
features = [
  # "autotune",
  "fusion",
  "ndarray",
  "std",
  # "vulkan",
  # "webgpu",
  "wgpu",
]

[dependencies.burn-wgpu]
git = "https://github.com/tracel-ai/burn.git"
default-features = true
features = [
  "fusion",
  "std",
  # "template",
]

[dependencies.cubecl]
git = "https://github.com/tracel-ai/cubecl.git"
default-features = true
features = [
  # "autotune-checks",
  "linalg",
  "std",
  # "template",
  # "wgpu",
  # "wgpu-spirv",
]

[dependencies.cubecl-runtime]
git = "https://github.com/tracel-ai/cubecl.git"
default-features = true
features = [
  # "autotune-checks",
  # "channel-cell",
  "channel-mpsc",
  # "channel-mutex",
  "std",
  # "storage-bytes",
]


[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"


[dependencies.web-sys]
version = "0.3"
features = [
  'Document',
  'Element',
  'HtmlElement',
  'Location',
  'Node',
  'Window',
]


[dev-dependencies]
bhtsne = "0.5.3"
criterion = { version = "0.6", features = ["html_reports"] }
futures-intrusive = { version = "0.5.0" }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = { version = "0.4.0" }
safetensors = "0.6"


[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.wasm-release]
strip = "symbols"
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"


[lib]
path = "src/lib.rs"

[[bin]]
name = "import"
path = "tool/import.rs"

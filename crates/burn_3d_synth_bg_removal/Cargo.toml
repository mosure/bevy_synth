[package]
name = "burn_3d_synth_bg_removal"
version = "0.1.0"
edition = "2024"

description = "Background removal (RMBG-1.4) for burn_3d_synth"
license = "MIT OR Apache-2.0"

[features]
default = []
import = ["burn-store", "serde", "serde_json"]

[dependencies]
burn = { version = "0.19", default-features = true, features = ["ndarray", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
burn-store = { version = "0.19", optional = true }

[dev-dependencies]
safetensors = "0.6"

[package]
name = "burn_synth_render"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
description = "Differentiable rendering primitives for burn_synth scene fitting"
keywords.workspace = true
categories.workspace = true

[features]
default = []
wgpu = ["burn/wgpu", "burn/autotune", "burn/fusion"]

[dependencies]
burn = { version = "=0.21.0", default-features = false, features = ["std", "autodiff", "ndarray"] }
gltf = "1.4"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.6"

[[bench]]
name = "soft_point_renderer"
path = "benches/soft_point_renderer.rs"
harness = false

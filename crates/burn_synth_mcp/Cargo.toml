[package]
name = "burn_synth_mcp"
version = "0.2.0"
edition = "2024"

description = "MCP server for burn_synth foreground extraction and 3D synthesis"
authors.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
burn = { version = "=0.21.0", default-features = false, features = ["std", "wgpu", "fusion"] }
burn_depth = { version = "0.4.1", default-features = false, features = ["backend_wgpu", "backend_fusion", "bpk"] }
burn_synth = { version = "0.2.0", path = "../burn_synth", features = ["import", "trellis-native-pbr", "trellis-wgpu", "wgpu"] }
burn_synth_scene = { version = "0.2.0", path = "../burn_synth_scene" }
burn_locate_anything = { version = "0.1.1", path = "../burn_locate_anything" }
bevy_synth_runtime = { version = "0.2.0", path = "../bevy_synth_runtime", default-features = false, features = ["shared-runtime"] }
clap = { version = "4.5", features = ["derive"] }
gltf = "1.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
meshopt = "0.6.2"

[features]
default = []
cuda = ["burn_synth/cuda"]
locate-anything-wgpu = ["burn_locate_anything/backend_wgpu"]

[dev-dependencies]
serde_json = "1.0"

[package]
name = "burn_synth_mcp"
version = "0.2.0"
edition = "2024"

description = "MCP server for burn_synth foreground extraction and 3D synthesis"
authors.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
burn_synth = { version = "0.2.0", path = "../burn_synth", features = ["import", "trellis-native-pbr", "trellis-wgpu", "wgpu"] }
burn_synth_grounding = { version = "0.2.0", path = "../burn_synth_grounding", features = ["locate-anything-wgpu"] }
burn_synth_scene = { version = "0.2.0", path = "../burn_synth_scene" }
bevy_synth_runtime = { version = "0.2.0", path = "../bevy_synth_runtime", default-features = false, features = ["shared-runtime"] }
clap = { version = "4.5", features = ["derive"] }
cubecl = { version = "=0.10.0", default-features = false, features = ["std"] }
gltf = "1.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
meshopt = "0.6.2"

[features]
default = ["segmentation-wgpu"]
cuda = ["burn_synth/cuda"]
locate-anything-wgpu = ["burn_synth_grounding/locate-anything-wgpu"]
segmentation-wgpu = ["burn_synth_grounding/segmentation-wgpu"]
segmentation-cuda = ["burn_synth_grounding/segmentation-cuda"]

[dev-dependencies]
serde_json = "1.0"

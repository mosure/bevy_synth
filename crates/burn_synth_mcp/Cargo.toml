[package]
name = "burn_synth_mcp"
version = "0.1.0"
edition = "2024"

description = "MCP server for burn_synth foreground extraction and 3D synthesis"
license = "MIT OR Apache-2.0"

[dependencies]
burn_synth = { path = "../burn_synth", features = ["wgpu"] }
clap = { version = "4.5", features = ["derive"] }
gltf = "1.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
meshopt = "0.6.2"

[features]
default = []
cuda = ["burn_synth/cuda"]

[dev-dependencies]
serde_json = "1.0"

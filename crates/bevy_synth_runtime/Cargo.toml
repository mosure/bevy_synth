[package]
name = "bevy_synth_runtime"
version = "0.1.2"
edition = "2024"

description = "Runtime services for the bevy_synth app (worker, args, cache, IO)"
authors.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["wgpu", "triposg", "shared-runtime"]
triposg = ["burn_synth/triposg"]
trellis = ["dep:burn_trellis", "burn_synth/trellis"]
wgpu = ["dep:burn-wgpu", "burn_synth/wgpu"]
cuda = ["burn-cuda", "burn_synth/cuda"]
shared-runtime = ["burn_synth/runtime"]

[dependencies]
bevy = "0.17"
bevy_asset = "0.17"
bevy_mesh = "0.17"
base64 = "0.22"
bytemuck = "1.25"
clap = { version = "4.5", features = ["derive"] }
burn = { version = "0.19", default-features = false, features = ["ndarray", "std"] }
burn_tripo = { version = "0.1.1", path = "../burn_tripo", features = ["import"] }
burn_foreground = { version = "0.1.1", path = "../burn_foreground", features = ["import"] }
burn_synth_import = { version = "0.1.0", path = "../burn_synth_import" }
burn-cuda = { version = "0.19", optional = true }
half = "2.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
safetensors = "0.6"
gltf = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
burn_trellis = { version = "0.1.0", path = "../burn_trellis", optional = true, features = ["runtime-model"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
burn-wgpu = { version = "0.19", optional = true, default-features = false, features = ["fusion", "std", "vulkan"] }
burn_synth = { version = "0.1.1", path = "../burn_synth", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
burn_synth = { version = "0.1.1", path = "../burn_synth", default-features = false, features = ["wasm-api", "wasm-api-wgpu"] }
web-sys = { version = "0.3", features = [
  "Storage",
  "Window",
  "Headers",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "Response",
] }
burn-wgpu = { version = "0.19", optional = true, default-features = false, features = ["fusion", "std", "webgpu"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"

[dev-dependencies]
sysinfo = "0.36"


[package]
name = "burn_synth"
version = "0.2.0"
edition = "2024"

description = "Shared utilities and pipeline re-exports for burn_synth"
authors.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["wgpu"]
triposg = ["dep:burn_tripo"]
trellis = ["dep:burn_trellis", "burn_trellis/runtime-model"]
trellis-wgpu = ["trellis", "burn_trellis/runtime-model-wgpu"]
bg-removal = ["dep:burn_foreground"]
wasm-api = ["import", "dep:burn", "dep:gltf", "dep:image", "dep:log"]
wasm-api-wgpu = ["wasm-api", "dep:burn-wgpu"]
runtime = [
  "import",
  "dep:burn",
  "dep:clap",
  "dep:env_logger",
  "dep:gltf",
  "dep:image",
  "dep:log",
  "dep:ureq",
]
wgpu = ["runtime", "dep:burn-wgpu"]
cuda = ["runtime", "dep:burn-cuda"]
import = [
  "triposg",
  "bg-removal",
  "burn_tripo/import",
  "burn_foreground/import",
]

[dependencies]
burn = { version = "0.21.0-pre.1", default-features = false, features = ["ndarray", "std"], optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
gltf = { version = "1.4", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
log = { version = "0.4", optional = true }
env_logger = { version = "0.11", optional = true }
burn_tripo = { version = "0.1.1", path = "../burn_tripo", optional = true, default-features = false }
burn_trellis = { version = "0.1.0", path = "../burn_trellis", optional = true }
burn_foreground = { version = "0.1.1", path = "../burn_foreground", optional = true, default-features = false }
burn-cuda = { version = "0.21.0-pre.1", optional = true }
serde_json = "1.0"
sha2 = "0.10"
burn_synth_import = { version = "0.1.0", path = "../burn_synth_import" }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "macos"))'.dependencies]
burn-wgpu = { version = "0.21.0-pre.1", optional = true, default-features = false, features = ["fusion", "std", "metal"] }
ureq = { version = "2.12", optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "macos")))'.dependencies]
burn-wgpu = { version = "0.21.0-pre.1", optional = true, default-features = false, features = ["fusion", "std", "vulkan"] }
ureq = { version = "2.12", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
burn-wgpu = { version = "0.21.0-pre.1", optional = true, default-features = false, features = ["fusion", "std", "webgpu"] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "console",
  "Headers",
  "Navigator",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "Response",
  "Window",
] }

[dev-dependencies]
sysinfo = "0.36"

[[bin]]
name = "burn_synth"
path = "src/main.rs"
required-features = ["runtime"]

[package]
name = "burn_foreground"
version = "0.1.1"
edition = "2024"

description = "Foreground extraction (RMBG-1.4 + RMBG-2.0) for burn_synth"
authors.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = []
import = [
  "burn-store",
  "serde",
  "serde_json",
  "clap",
  "dep:burn-wgpu",
  "burn_synth_import",
]

[dependencies]
burn = { version = "=0.21.0", default-features = false, features = ["ndarray", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
burn_synth_import = { version = "0.1.0", path = "../burn_synth_import", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
burn-store = { version = "=0.21.0", optional = true, default-features = false, features = ["std", "burnpack", "safetensors"] }
clap = { version = "4.5", features = ["derive"], optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "macos"))'.dependencies]
burn-wgpu = { version = "=0.21.0", optional = true, default-features = false, features = ["fusion", "std", "metal"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "macos")))'.dependencies]
burn-wgpu = { version = "=0.21.0", optional = true, default-features = false, features = ["fusion", "std", "vulkan"] }

[dev-dependencies]
safetensors = "0.6"
criterion = { version = "0.6", features = ["html_reports"] }

[[bench]]
name = "rmbg_variants"
path = "benches/rmbg_variants.rs"
harness = false

[[bin]]
name = "foreground_import"
path = "tool/foreground_import.rs"
required-features = ["import"]

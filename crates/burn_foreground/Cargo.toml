[package]
name = "burn_foreground"
version = "0.1.0"
edition = "2024"

description = "Foreground extraction (RMBG-1.4 + RMBG-2.0) for burn_synth"
license = "MIT OR Apache-2.0"

[features]
default = []
import = ["burn-store", "serde", "serde_json"]

[dependencies]
burn = { version = "0.19", default-features = false, features = ["ndarray", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
burn-store = { version = "0.19", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ort = { version = "2.0.0-rc.11", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native"] }

[dev-dependencies]
safetensors = "0.6"
criterion = { version = "0.6", features = ["html_reports"] }

[[bench]]
name = "rmbg_variants"
path = "benches/rmbg_variants.rs"
harness = false



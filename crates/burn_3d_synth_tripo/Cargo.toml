[package]
name = "burn_3d_synth_tripo"
description = "TripoSG(-scribble) implemented in burn"
version = "0.1.0"
edition = "2024"
authors = ["mosure <mitchell@mosure.me>"]
license = "MIT OR Apache-2.0"
keywords = [
  "burn",
  "triposg",
  "scribble",
  "vit",
]
categories = [
  "computer-vision",
]
homepage = "https://github.com/mosure/burn_3d_synth"
repository = "https://github.com/mosure/burn_3d_synth"
readme = "../../README.md"
exclude = [
  ".devcontainer",
  ".github",
  "docs",
  "dist",
  "build",
  "assets",
  "credits",
]

[features]
default = []

benchmark = ["burn/autotune", "burn/fusion"]
import = ["bevy_args", "burn-store", "clap", "serde", "serde_json"]
cuda = ["burn-cuda"]
report = []


[dependencies]
burn_dino = { version = "0.6", default-features = false, features = ["backend_ndarray"] }
burn_3d_synth_bg_removal = { path = "../burn_3d_synth_bg_removal", features = ["import"] }
burn-store = { version = "0.19", optional = true }
bevy_args = { version = "2.0", optional = true }
bytemuck = "1.25"
marching-cubes = "0.1.2"
fast-surface-nets = "0.2.1"
clap = { version = "4.5", features = ["derive"], optional = true }
safetensors = "0.6"
serde_json = { version = "1.0", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
burn-cuda = { version = "0.19", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }



[dependencies.burn]
version = "0.19"
default-features = false
features = [
  "fusion",
  "ndarray",
  "std",
]

[dependencies.burn-wgpu]
version = "0.19"
default-features = false
features = [
  "fusion",
  "std",
]

[dependencies.cubecl]
version = "0.8"
default-features = true
features = ["std"]


[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"


[dependencies.web-sys]
version = "0.3"
features = [
  'Document',
  'Element',
  'HtmlElement',
  'Location',
  'Node',
  'Window',
]


[dev-dependencies]
bhtsne = "0.5.3"
criterion = { version = "0.6", features = ["html_reports"] }
futures-intrusive = { version = "0.5.0" }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = { version = "0.4.0" }


[lib]
path = "src/lib.rs"

[[bin]]
name = "import"
path = "tool/import.rs"
required-features = ["import"]

[[bin]]
name = "triposg_hook"
path = "tool/triposg_hook.rs"
required-features = ["import"]

[[bin]]
name = "triposg_dit_hook"
path = "tool/triposg_dit_hook.rs"
required-features = ["import"]

[[bin]]
name = "triposg_dino_hook"
path = "tool/triposg_dino_hook.rs"
required-features = ["import"]

[[bin]]
name = "triposg_profile"
path = "tool/triposg_profile.rs"
required-features = ["import"]

[[bin]]
name = "triposg_import"
path = "tool/triposg_import.rs"
required-features = ["import"]

[[bin]]
name = "list_safetensors"
path = "tool/list_safetensors.rs"
required-features = ["import"]

[[bin]]
name = "triposg_report"
path = "src/bin/triposg_report.rs"
required-features = ["import", "report"]

[[bench]]
name = "triposg_pipeline"
path = "benches/triposg_pipeline.rs"
harness = false

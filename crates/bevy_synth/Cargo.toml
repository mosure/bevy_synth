[package]
name = "bevy_synth"
version = "0.1.0"
edition = "2024"

description = "bevy media synthesis plugin"
license = "MIT OR Apache-2.0"

[features]
default = ["wgpu", "triposg"]
triposg = ["bevy_synth_runtime/triposg", "bevy_synth_runtime/shared-runtime", "bevy_synth_ui/triposg"]
trellis = ["bevy_synth_runtime/trellis", "bevy_synth_runtime/shared-runtime", "bevy_synth_ui/trellis"]
wgpu = ["bevy_synth_runtime/wgpu", "bevy_synth_runtime/shared-runtime"]
cuda = ["bevy_synth_runtime/cuda", "bevy_synth_runtime/shared-runtime"]
solari = []
dlss = []
force_disable_dlss = []

[dependencies]
bevy = { version = "0.17", features = ["http", "https", "webgpu"] }
bevy_panorbit_camera = "0.33.0"
bevy_infinite_grid = "0.17"
bevy_mesh = "0.17"
bevy_picking = { version = "0.17", features = ["bevy_mesh_picking_backend"] }
bevy_file_dialog = { path = "../bevy_file_dialog" }
bevy_editor_core = { path = "../bevy_editor_core" }
bevy_transform_gizmos = { path = "../bevy_transform_gizmos" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy_synth_runtime = { path = "../bevy_synth_runtime", default-features = false, features = ["shared-runtime"] }
bevy_synth_ui = { path = "../bevy_synth_ui" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = "0.3"

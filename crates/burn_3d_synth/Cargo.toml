[package]
name = "burn_3d_synth"
version = "0.1.0"
edition = "2024"

description = "Shared utilities and pipeline re-exports for burn_3d_synth"
license = "MIT OR Apache-2.0"

[features]
default = []
triposg = ["dep:burn_3d_synth_tripo"]
bg-removal = ["dep:burn_3d_synth_bg_removal"]
import = [
  "triposg",
  "bg-removal",
  "burn_3d_synth_tripo/import",
  "burn_3d_synth_bg_removal/import",
]

[dependencies]
burn_3d_synth_tripo = { path = "../burn_3d_synth_tripo", optional = true, default-features = false }
burn_3d_synth_bg_removal = { path = "../burn_3d_synth_bg_removal", optional = true, default-features = false }

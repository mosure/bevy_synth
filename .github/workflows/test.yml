name: test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_DEV_SPLIT_DEBUGINFO: off
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_TEST_SPLIT_DEBUGINFO: off
  TRELLIS2_E2E_STRICT: ${{ vars.TRELLIS2_E2E_STRICT || '' }}
  TRELLIS2_E2E_DEVICE: ${{ vars.TRELLIS2_E2E_DEVICE || '' }}
  TRELLIS2_E2E_MAX_HOST_READBACKS: ${{ vars.TRELLIS2_E2E_MAX_HOST_READBACKS || '' }}
  TRELLIS2_E2E_MAX_HOST_READBACK_ELEMENTS: ${{ vars.TRELLIS2_E2E_MAX_HOST_READBACK_ELEMENTS || '' }}
  TRELLIS2_WEIGHTS_ROOT: ${{ vars.TRELLIS2_WEIGHTS_ROOT || '' }}
  TRELLIS2_IMAGE_LARGE_ROOT: ${{ vars.TRELLIS2_IMAGE_LARGE_ROOT || '' }}

jobs:
  test:

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        rust-toolchain:
          - nightly

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v3

    - name: Setup ${{ matrix.rust-toolchain }} rust toolchain with caching
      uses: brndnmtthws/rust-action@v1
      with:
        toolchain: ${{ matrix.rust-toolchain }}
        components: rustfmt, clippy
        enable-sccache: "false"

    - name: canonical runtime guards
      shell: bash
      run: bash ./scripts/guard_canonical_runtime.sh

    - name: test (default)
      run: cargo test

    - name: clippy (trellis)
      run: cargo clippy -p burn_trellis --features runtime-model-wgpu -- -D warnings

    - name: test (trellis strict optional)
      if: ${{ env.TRELLIS2_E2E_STRICT == '1' && env.TRELLIS2_WEIGHTS_ROOT != '' }}
      run: cargo test -p burn_trellis --features runtime-model-wgpu --test e2e_hook_alignment -- --nocapture

    - name: guard (trellis strict benchmark invariants optional)
      if: ${{ env.TRELLIS2_E2E_STRICT == '1' && env.TRELLIS2_WEIGHTS_ROOT != '' && env.TRELLIS2_E2E_DEVICE == 'wgpu' }}
      shell: bash
      run: |
        set -euo pipefail
        run_id="$(date -u +%Y%m%dT%H%M%SZ)_trellis2_ci_strict_benchmark"
        run_dir="tmp/runs/${run_id}"
        mkdir -p "${run_dir}"
        strict_log="${run_dir}/01_run.log"
        cargo run -p burn_trellis --features runtime-model-wgpu --bin trellis2_run -- \
          --input docs/input_chair.jpg \
          --quality low \
          --backend wgpu \
          --strict-benchmark \
          --require-runtime-model \
          --repeat 2 \
          >"${strict_log}" 2>&1
        TRELLIS2_STRICT_BENCH_LOG="${strict_log}" \
        TRELLIS2_STRICT_BENCH_MIN_SHAPE_DISPATCHES=1 \
        TRELLIS2_STRICT_BENCH_MIN_TEX_DISPATCHES=1 \
        bash ./scripts/guard_canonical_runtime.sh

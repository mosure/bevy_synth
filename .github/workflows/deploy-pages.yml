name: deploy github pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: install wasm-bindgen cli
        run: cargo install wasm-bindgen-cli --version 0.2.108 --locked

      - name: build web app
        env:
          # Build-time-only vars embedded into wasm via option_env!.
          # Example S3 base: https://example-bucket.s3.amazonaws.com/burn_synth/assets
          BURN_SYNTH_WEB_ASSET_ROOT: ${{ vars.BURN_SYNTH_WEB_ASSET_ROOT || secrets.BURN_SYNTH_WEB_ASSET_ROOT }}
          # Optional burnpack safety cap (bytes) for browser downloads; leave empty to use default (1 GiB).
          BURN_SYNTH_WEB_MAX_BPK_BYTES: ${{ vars.BURN_SYNTH_WEB_MAX_BPK_BYTES || secrets.BURN_SYNTH_WEB_MAX_BPK_BYTES }}
          # Example S3 path: https://example-bucket.s3.amazonaws.com/burn_synth/assets/models/MIDI-3D
          # Supports plain .bpk and shard manifests (*.bpk.shards.json + *.bpk.shard-*).
          TRIPOSG_WEIGHTS_ROOT: ${{ vars.TRIPOSG_WEIGHTS_ROOT || secrets.TRIPOSG_WEIGHTS_ROOT }}
          # Example S3 path: https://example-bucket.s3.amazonaws.com/burn_synth/assets/models/TripoSG-scribble
          TRIPOSG_SCRIBBLE_WEIGHTS_ROOT: ${{ vars.TRIPOSG_SCRIBBLE_WEIGHTS_ROOT || secrets.TRIPOSG_SCRIBBLE_WEIGHTS_ROOT }}
          # Example S3 path: https://example-bucket.s3.amazonaws.com/burn_synth/assets/models/RMBG-1.4
          # Supports plain .bpk and shard manifests (*.bpk.shards.json + *.bpk.shard-*).
          RMBG14_WEIGHTS_ROOT: ${{ vars.RMBG14_WEIGHTS_ROOT || secrets.RMBG14_WEIGHTS_ROOT || vars.RMBG_WEIGHTS_ROOT || secrets.RMBG_WEIGHTS_ROOT }}
          # Example S3 path: https://example-bucket.s3.amazonaws.com/burn_synth/assets/models/RMBG-2.0
          # Supports plain .bpk and shard manifests (*.bpk.shards.json + *.bpk.shard-*).
          RMBG2_WEIGHTS_ROOT: ${{ vars.RMBG2_WEIGHTS_ROOT || secrets.RMBG2_WEIGHTS_ROOT }}
          # Shared fallback used by older paths; keep pointed at RMBG-1.4 unless intentionally shared.
          RMBG_WEIGHTS_ROOT: ${{ vars.RMBG_WEIGHTS_ROOT || secrets.RMBG_WEIGHTS_ROOT }}
          # Example S3 path: https://example-bucket.s3.amazonaws.com/burn_synth/assets/models/TRELLIS.2-4B
          # Supports plain .bpk and shard manifests (*.bpk.shards.json + *.bpk.shard-*).
          TRELLIS2_WEIGHTS_ROOT: ${{ vars.TRELLIS2_WEIGHTS_ROOT || secrets.TRELLIS2_WEIGHTS_ROOT }}
          # Example S3 path: https://example-bucket.s3.amazonaws.com/burn_synth/assets/models/TRELLIS-image-large
          TRELLIS2_IMAGE_LARGE_ROOT: ${{ vars.TRELLIS2_IMAGE_LARGE_ROOT || secrets.TRELLIS2_IMAGE_LARGE_ROOT }}
        run: |
          unset RUSTFLAGS
          unset CARGO_ENCODED_RUSTFLAGS
          cargo build -p bevy_synth --target wasm32-unknown-unknown --profile wasm-release
          wasm-bindgen target/wasm32-unknown-unknown/wasm-release/bevy_synth.wasm --out-dir docs --target web --no-typescript

      - name: configure pages
        uses: actions/configure-pages@v5

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v4

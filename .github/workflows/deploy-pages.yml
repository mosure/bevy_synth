name: deploy github pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: install wasm-bindgen cli
        run: cargo install wasm-bindgen-cli --version 0.2.108 --locked

      - name: build web app
        env:
          # Optional burnpack safety cap (bytes) for browser downloads; leave empty to use default (1 GiB).
          BURN_SYNTH_WEB_MAX_BPK_BYTES: ${{ vars.BURN_SYNTH_WEB_MAX_BPK_BYTES || secrets.BURN_SYNTH_WEB_MAX_BPK_BYTES || '' }}
        run: |
          # Asset/model root URLs are baked into the wasm binaries.
          # Keep workflow builds deterministic by disallowing URL/root overrides here.
          unset MODEL_BASE_URL
          unset TRIPOSG_WEIGHTS_ROOT
          unset TRIPOSG_SCRIBBLE_WEIGHTS_ROOT
          unset RMBG14_WEIGHTS_ROOT
          unset RMBG2_WEIGHTS_ROOT
          unset RMBG_WEIGHTS_ROOT
          unset TRELLIS2_WEIGHTS_ROOT
          unset TRELLIS2_IMAGE_LARGE_ROOT
          unset BURN_SYNTH_WEB_ASSET_ROOT

          unset RUSTFLAGS
          unset CARGO_ENCODED_RUSTFLAGS
          unset CARGO_BUILD_RUSTFLAGS
          unset CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS
          unset RUSTDOCFLAGS

          rm -rf site
          mkdir -p site/out
          cp www/index.html site/index.html
          cp www/synth_api.html site/synth_api.html

          cargo build -p bevy_synth --target wasm32-unknown-unknown --profile wasm-release --features wgpu,triposg
          wasm-bindgen target/wasm32-unknown-unknown/wasm-release/bevy_synth.wasm --out-dir site/out --target web --no-typescript

          cargo build -p burn_synth --target wasm32-unknown-unknown --profile wasm-release --features wasm-api,wasm-api-wgpu
          wasm-bindgen target/wasm32-unknown-unknown/wasm-release/burn_synth.wasm --out-dir site/out --target web --no-typescript

          test -f site/out/bevy_synth_bg.wasm
          test -f site/out/burn_synth_bg.wasm

      - name: configure pages
        uses: actions/configure-pages@v5

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v4

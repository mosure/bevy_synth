name: deploy github pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: install wasm-bindgen cli
        run: cargo install wasm-bindgen-cli --version 0.2.108 --locked

      - name: build web app
        env:
          # Build-time-only vars embedded into wasm via option_env!.
          # Canonical hosted model base URL (matches web bundle model directory structure).
          MODEL_BASE_URL: https://aberration.technology/model
          # Optional burnpack safety cap (bytes) for browser downloads; leave empty to use default (1 GiB).
          BURN_SYNTH_WEB_MAX_BPK_BYTES: ${{ vars.BURN_SYNTH_WEB_MAX_BPK_BYTES || secrets.BURN_SYNTH_WEB_MAX_BPK_BYTES }}
          # Explicit hosted model roots (no vars/secrets URL indirection).
          # Supports plain .bpk and parts manifests (*.bpk.parts.json + *.bpk.part-*).
          TRIPOSG_WEIGHTS_ROOT: ${{ format('{0}/MIDI-3D', env.MODEL_BASE_URL) }}
          TRIPOSG_SCRIBBLE_WEIGHTS_ROOT: ${{ format('{0}/TripoSG-scribble', env.MODEL_BASE_URL) }}
          RMBG14_WEIGHTS_ROOT: ${{ format('{0}/RMBG-1.4', env.MODEL_BASE_URL) }}
          RMBG2_WEIGHTS_ROOT: ${{ format('{0}/RMBG-2.0', env.MODEL_BASE_URL) }}
          RMBG_WEIGHTS_ROOT: ${{ format('{0}/RMBG-1.4', env.MODEL_BASE_URL) }}
          TRELLIS2_WEIGHTS_ROOT: ${{ format('{0}/TRELLIS.2-4B', env.MODEL_BASE_URL) }}
          TRELLIS2_IMAGE_LARGE_ROOT: ${{ format('{0}/TRELLIS-image-large', env.MODEL_BASE_URL) }}
        run: |
          unset RUSTFLAGS
          unset CARGO_ENCODED_RUSTFLAGS
          unset CARGO_BUILD_RUSTFLAGS
          unset CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS
          unset RUSTDOCFLAGS

          rm -rf site
          mkdir -p site/out
          cp www/index.html site/index.html
          cp www/synth_api.html site/synth_api.html

          cargo build -p bevy_synth --target wasm32-unknown-unknown --profile wasm-release --features wgpu,triposg
          wasm-bindgen target/wasm32-unknown-unknown/wasm-release/bevy_synth.wasm --out-dir site/out --target web --no-typescript

          cargo build -p burn_synth --target wasm32-unknown-unknown --profile wasm-release --features wasm-api,wasm-api-wgpu
          wasm-bindgen target/wasm32-unknown-unknown/wasm-release/burn_synth.wasm --out-dir site/out --target web --no-typescript

          test -f site/out/bevy_synth_bg.wasm
          test -f site/out/burn_synth_bg.wasm

      - name: configure pages
        uses: actions/configure-pages@v5

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v4
